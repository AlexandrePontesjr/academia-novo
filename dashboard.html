<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Início (Painel)</title>

</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('dashboard.html', `

          </div>

            <div class="metric-tile" style="padding:0.7rem 0.85rem;">
              <div class="metric-label">A vencer</div>
              <div class="tabular-nums" style="font-size:1.15rem;font-weight:700;">R$ 1.840</div>
            </div>
            <div class="metric-tile" style="padding:0.7rem 0.85rem;">
              <div class="metric-label">Em atraso</div>
              <div class="tabular-nums" style="font-size:1.15rem;font-weight:700;color:var(--status-bad);">R$ 440</div>
            </div>
          </div>
        </section>

        <!-- Últimos Check-ins + Distribuição de Planos -->
        <section class="panel" style="display:grid;gap:0.75rem;">
          <div class="panel-header" style="margin-bottom:0;">
            <h2 class="panel-title">Últimas entradas</h2>
            <a href="check-in.html" class="panel-arrow" aria-label="Abrir balcão">↗</a>
          </div>
          <div>
            <div class="feed-item">
              <div style="display:flex;align-items:center;gap:0.65rem;">
                <span class="avatar-circle" style="width:2.1rem;height:2.1rem;font-size:0.72rem;">LA</span>

                  <div style="font-size:0.74rem;color:var(--muted-foreground);">Constância 3M</div>
                </div>
              </div>
              <span class="badge badge-ok tabular-nums">08:14</span>
            </div>
            <div class="feed-item">
              <div style="display:flex;align-items:center;gap:0.65rem;">
                <span class="avatar-circle" style="width:2.1rem;height:2.1rem;font-size:0.72rem;">FM</span>

                </div>
              </div>
              <span class="badge badge-ok tabular-nums">06:34</span>
            </div>
          </div>
        </section>

        <!-- Vencimentos próximos -->
        <section class="panel col-span-2-md">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Vencimentos nos próximos 7 dias</h2>
              <div style="font-size:0.78rem;color:var(--muted-foreground);">Acompanhamento rápido de renovações e cobranças</div>
            </div>
            <a href="payments.html" class="panel-arrow" aria-label="Ver pagamentos">↗</a>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Aluno</th>
                  <th>Plano</th>
                  <th>Vence em</th>
                  <th>Valor</th>
                  <th>Situação</th>
                  <th style="text-align:right;">Ação</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><a href="student-detail.html" style="font-weight:600;color:var(--primary);">Lucas Andrade</a></td>
                  <td>Plano Constância 3M · Trimestral</td>
                  <td class="tabular-nums">15/11/2026</td>
                  <td class="tabular-nums">R$ 95,00</td>
                  <td><span class="badge badge-warn">Pendente</span></td>
                  <td style="text-align:right;"><a href="payments.html" class="btn btn-secondary btn-sm">Receber</a></td>
                </tr>
                <tr>
                  <td><a href="student-detail.html" style="font-weight:600;color:var(--primary);">Fernanda Maia</a></td>
                  <td>Plano Bairro Mensal · Mensal</td>
                  <td class="tabular-nums">16/11/2026</td>
                  <td class="tabular-nums">R$ 110,00</td>
                  <td><span class="badge badge-warn">Pendente</span></td>
                  <td style="text-align:right;"><a href="payments.html" class="btn btn-secondary btn-sm">Receber</a></td>
                </tr>
                <tr>
                  <td><a href="student-detail.html" style="font-weight:600;color:var(--primary);">Beatriz Lima</a></td>
                  <td>Plano Bairro Mensal · Mensal</td>
                  <td class="tabular-nums">10/11/2026</td>
                  <td class="tabular-nums">R$ 110,00</td>
                  <td><span class="badge badge-bad">Atrasado</span></td>
                  <td style="text-align:right;"><a href="payments.html" class="btn btn-primary btn-sm">Regularizar</a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    `);
  </script>
</body>
</html>
