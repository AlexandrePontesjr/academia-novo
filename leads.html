<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Interessados (Leads)</title>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('leads.html', `
      <div class="screen-header">
        <div>
          <div class="eyebrow">Captação</div>
          <h1 class="screen-title">Interessados</h1>
          <p class="screen-meta">Solicitações enviadas pelo site público (/matricula).</p>
        </div>
        <a href="matricula.html" class="btn btn-secondary">Ver formulário público</a>
      </div>

      <div class="toolbar">
        <div class="filter-pills">
          <button type="button" class="filter-pill active" onclick="filterLeads('all', this)">Todos</button>
          <button type="button" class="filter-pill" onclick="filterLeads('new', this)">Novos</button>
          <button type="button" class="filter-pill" onclick="filterLeads('contacted', this)">Contatados</button>
          <button type="button" class="filter-pill" onclick="filterLeads('converted', this)">Convertidos</button>
        </div>
      </div>

      <section class="panel" style="padding:0;">
        <div class="table-wrap" style="border:none;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Contato</th>
                <th>Interesse</th>
                <th>Recebido em</th>
                <th>Situação</th>
                <th style="text-align:right;">Ação</th>
              </tr>
            </thead>
            <tbody id="leads-tbody"></tbody>
          </table>
        </div>
      </section>
    `);

    const LEADS = [
      { id: 1, name: 'Mariana Oliveira Santos', phone: '(92) 99142-3810', plan: 'Plano Constância 3M', date: '13/11/2026', status: 'new', label: 'Novo', badge: 'badge-warn' },
      { id: 2, name: 'Eduardo Rocha', phone: '(92) 98412-0091', plan: 'Aula experimental', date: '12/11/2026', status: 'contacted', label: 'Contatado', badge: 'badge-idle' },
      { id: 3, name: 'Larissa Pinheiro', phone: '(92) 99204-1188', plan: 'Plano Bairro Mensal', date: '10/11/2026', status: 'converted', label: 'Convertido', badge: 'badge-ok' },
    ];

    let leadFilter = 'all';

    window.filterLeads = function (st, btn) {
      leadFilter = st;
      document.querySelectorAll('.filter-pill').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      renderLeads();
    };

    window.convertLead = function (id) {
      const l = LEADS.find((x) => x.id === id);
      if (l) {
        l.status = 'converted';
        l.label = 'Convertido';
        l.badge = 'badge-ok';
        renderLeads();
        window.demoToast(l.name + ' convertido(a) em aluno!');
      }
    };

    window.renderLeads = function () {
      const rows = LEADS.filter((l) => leadFilter === 'all' || l.status === leadFilter);
      document.getElementById('leads-tbody').innerHTML = rows
        .map(
          (l) => `
        <tr>
          <td style="font-weight:600;">${l.name}</td>
          <td class="tabular-nums">${l.phone}</td>
          <td>${l.plan}</td>
          <td class="tabular-nums">${l.date}</td>
          <td><span class="badge ${l.badge}">${l.label}</span></td>
          <td style="text-align:right;">
            ${
              l.status !== 'converted'
                ? `<button type="button" class="btn btn-primary btn-sm" onclick="convertLead(${l.id})">Converter em aluno</button>`
                : `<a href="student-detail.html" class="btn btn-secondary btn-sm">Ver aluno</a>`
            }
          </td>
        </tr>`
        )
        .join('');
    };

    renderLeads();
  </script>
</body>
</html>
