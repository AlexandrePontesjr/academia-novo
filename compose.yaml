# Sobe a stack inteira: `docker compose up --build --wait`, com `.env` copiado de `.env.example`.
name: academia

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # por TCP: na inicialização o Postgres sobe um servidor temporário que só atende no socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Execução única: aplica as migrações e termina. A API só inicia se isto sair com 0.
  migrate:
    build:
      context: .
      target: migrate
    init: true
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    init: true
    environment:
      DATABASE_URL: *database-url
      PORT: 3001
    ports:
      - 127.0.0.1:${PORT:?}:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: web
    init: true
    environment:
      API_URL: http://api:3001
    ports:
      - 127.0.0.1:${WEB_PORT:?}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
