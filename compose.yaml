# Sobe a stack inteira: `docker compose up --build --wait`, com `.env` copiado de `.env.example`.
name: academia

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # por TCP: na inicialização o Postgres sobe um servidor temporário que só atende no socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Execução única: aplica as migrações e termina. A API só inicia se isto sair com 0.
  migrate:
    build:
      context: .
      target: migrate
    init: true
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Armazenamento de objetos das fotos (door 3). Só a API o alcança: a porta fica em 127.0.0.1.
  # A imagem oficial `minio/minio` deixou de ser publicada; este é o fork da comunidade (pgsty), fixado por digest.
  storage:
    image: &storage-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?}
    ports:
      - 127.0.0.1:${STORAGE_PORT:?}:9000
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  # Execução única: cria o bucket, privado por padrão, e termina. A API só inicia se isto sair com 0.
  storage-init:
    image: *storage-image
    entrypoint:
      - sh
      - -c
      - mc alias set local http://storage:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
    depends_on:
      storage:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    init: true
    environment:
      DATABASE_URL: *database-url
      PORT: 3001
      AUTH_SECRET: ${AUTH_SECRET:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      PHOTO_URL_SECRET: ${PHOTO_URL_SECRET:?}
    ports:
      - 127.0.0.1:${PORT:?}:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: web
    init: true
    environment:
      API_URL: http://api:3001
    ports:
      - 127.0.0.1:${WEB_PORT:?}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  storage-data:
