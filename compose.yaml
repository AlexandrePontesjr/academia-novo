# Sobe a stack inteira: `docker compose up --build --wait`, com `.env` copiado de `.env.example`.
name: academia

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # por TCP: na inicialização o Postgres sobe um servidor temporário que só atende no socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Execução única: aplica as migrações e termina. A API só inicia se isto sair com 0.
  migrate:
    build:
      context: .
      target: migrate
    init: true
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Armazenamento de objetos das fotos (door 1). Só a API o alcança: a porta fica em 127.0.0.1.
  # O RustFS (Apache 2.0) substituiu o MinIO, cuja imagem deixou de ser publicada; fixado por tag e digest.
  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?}
      RUSTFS_CONSOLE_ENABLE: 'false'
      # o log vai para a saída padrão do container, que `docker compose logs storage` mostra
      RUSTFS_OBS_LOG_DIRECTORY: ''
    ports:
      - 127.0.0.1:${STORAGE_PORT:?}:9000
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9000/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30

  # Execução única: cria o bucket, privado por padrão, habilita o versionamento (door 4) e termina.
  # A API só inicia se isto sair com 0.
  storage-init:
    image: amazon/aws-cli:2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780
    entrypoint:
      - sh
      - -c
      - 'aws s3api head-bucket --bucket "$$S3_BUCKET" || aws s3api create-bucket --bucket "$$S3_BUCKET" && aws s3api put-bucket-versioning --bucket "$$S3_BUCKET" --versioning-configuration Status=Enabled'
    environment:
      AWS_ENDPOINT_URL: http://storage:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:?}
    depends_on:
      storage:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    init: true
    environment:
      DATABASE_URL: *database-url
      PORT: 3001
      AUTH_SECRET: ${AUTH_SECRET:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      PHOTO_URL_SECRET: ${PHOTO_URL_SECRET:?}
    ports:
      - 127.0.0.1:${PORT:?}:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: web
    init: true
    environment:
      API_URL: http://api:3001
    ports:
      - 127.0.0.1:${WEB_PORT:?}:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  rustfs-data:
