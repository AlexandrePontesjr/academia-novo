<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Novo Plano</title>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('plans.html', `
      <div class="screen-header">
        <div>
          <div class="eyebrow">Planos</div>
          <h1 class="screen-title">Novo plano</h1>
          <p class="screen-meta">Defina nome, periodicidade e valor mensal.</p>
        </div>
        <a href="plans.html" class="btn btn-secondary">← Voltar</a>
      </div>

      <section class="panel" style="max-width:36rem;">
        <form onsubmit="event.preventDefault(); window.demoToast('Plano criado com sucesso!'); setTimeout(()=>location.href='plans.html', 800);" style="display:grid;gap:1rem;">
          <div class="field">
            <label class="label" for="p-nome">Nome do plano</label>
            <input class="input" id="p-nome" placeholder="Ex: Plano Semestral Manhã" required />
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="p-per">Periodicidade</label>
              <select class="select" id="p-per">
                <option>Mensal</option>
                <option>Trimestral</option>
                <option>Semestral</option>
                <option>Anual</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="p-val">Valor mensal (R$)</label>
              <input class="input" id="p-val" value="90,00" required />
            </div>
          </div>
          <div class="field">
            <label class="label" for="p-desc">Descrição</label>
            <textarea class="textarea" id="p-desc" rows="3" placeholder="Detalhes de horário e benefícios..."></textarea>
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
            <a href="plans.html" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar plano</button>
          </div>
        </form>
      </section>
    `);
  </script>
</body>
</html>
