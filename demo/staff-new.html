<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Novo Funcionário</title>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('staff.html', `
      <div class="screen-header">
        <div>
          <div class="eyebrow">Equipe</div>
          <h1 class="screen-title">Novo funcionário</h1>
          <p class="screen-meta">Cadastro de colaborador da DukFit.</p>
        </div>
        <a href="staff.html" class="btn btn-secondary">← Voltar</a>
      </div>

      <section class="panel" style="max-width:42rem;">
        <form onsubmit="event.preventDefault(); window.demoToast('Funcionário cadastrado!'); setTimeout(()=>location.href='staff-detail.html', 800);" style="display:grid;gap:1rem;">
          <div class="field">
            <label class="label" for="st-nome">Nome completo</label>
            <input class="input" id="st-nome" placeholder="Ex: Bruno Tavares" required />
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="st-cpf">CPF</label>
              <input class="input" id="st-cpf" placeholder="000.000.000-00" required />
            </div>
            <div class="field">
              <label class="label" for="st-cargo">Função</label>
              <select class="select" id="st-cargo">
                <option>Educador Físico</option>
                <option>Recepção</option>
                <option>Limpeza / Manutenção</option>
                <option>Gerência</option>
              </select>
            </div>
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="st-cref">CREF (opcional)</label>
              <input class="input" id="st-cref" placeholder="000000-G/AM" />
            </div>
            <div class="field">
              <label class="label" for="st-tel">Telefone</label>
              <input class="input" id="st-tel" placeholder="(92) 99999-0000" required />
            </div>
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
            <a href="staff.html" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar funcionário</button>
          </div>
        </form>
      </section>
    `);
  </script>
</body>
</html>
