<!doctype html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="assets/demo.css" />
  <style>
    .doc-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1.25rem;
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      font-size: 0.8rem;
      color: var(--muted-foreground);
      margin-bottom: 1.25rem;
    }
    .doc-meta-bar strong {
      color: var(--foreground);
      font-weight: 600;
    }
    .doc-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.5rem;
    }
    .doc-toc a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.38rem 0.78rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted-foreground);
      transition: border-color var(--duration-quick) var(--ease-smooth-out), color var(--duration-quick) var(--ease-smooth-out), background-color var(--duration-quick) var(--ease-smooth-out);
    }
    .doc-toc a:hover {
      border-color: var(--primary);
      color: var(--foreground);
      background: var(--status-ok-surface);
    }
    .doc-section {
      margin-bottom: 1.75rem;
      scroll-margin-top: 1.25rem;
    }
    .doc-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .doc-section-title {
      margin: 0.15rem 0 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .doc-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
    }
    .doc-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .doc-card-num {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .doc-card-title {
      margin: 0.2rem 0 0;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .doc-card-body {
      margin: 0;
      font-size: 0.86rem;
      color: var(--muted-foreground);
      line-height: 1.6;
    }
    .doc-card-body strong {
      color: var(--foreground);
      font-weight: 600;
    }
    .doc-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted-foreground);
    }
    .doc-card-foot a {
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
    }
    .doc-card-foot a:hover {
      text-decoration: underline;
    }
    .doc-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      text-align: left;
    }
    .doc-table th {
      padding: 0.78rem 1rem;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      white-space: nowrap;
    }
    .doc-table td {
      padding: 0.82rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      line-height: 1.5;
    }
    .doc-table tr:last-child td {
      border-bottom: none;
    }
    .doc-quote {
      border-left: 3px solid var(--primary);
      padding: 0.9rem 1.15rem;
      background: var(--card);
      border-radius: 0 var(--radius) var(--radius) 0;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .doc-quote p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .doc-roadmap {
      display: grid;
      gap: 0.85rem;
    }
    @media (min-width: 768px) {
      .doc-roadmap {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    .doc-step {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      display: grid;
      gap: 0.45rem;
      align-content: start;
    }
    .doc-step-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--primary);
    }
    .doc-step h3 {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 700;
    }
    .doc-step p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted-foreground);
      line-height: 1.5;
    }

    @media print {
      .side-nav,
      .app-topbar,
      .bottom-nav,
      .fab-checkin,
      .no-print {
        display: none !important;
      }
      .app-shell {
        padding-left: 0 !important;
      }
      .container-app {
        max-width: 100% !important;
        padding: 0 !important;
      }
      .panel,
      .doc-meta-bar,
      .doc-table-wrap,
      .doc-step,
      .doc-quote {
        background: #ffffff !important;
        color: #111111 !important;
        border-color: #d4d4d8 !important;
        break-inside: avoid;
      }
      .doc-card-body,
      .doc-meta-bar,
      .doc-step p,
      .screen-meta,
      .kpi-card-sub,
      .doc-table th {
        color: #444444 !important;
      }
      .eyebrow,
      .doc-card-num,
      .doc-step-tag {
        color: #7c5b28 !important;
      }
      .badge {
        border: 1px solid #d4d4d8 !important;
        background: #f4f4f5 !important;
        color: #111111 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('visao-negocio.html', `

        <div class="doc-quote" style="margin-bottom:1rem;">
          <p>
            O objetivo do <strong style="color:var(--primary);">DukFit</strong> não é apenas substituir planilhas: é devolver <strong class="font-editorial" style="font-size:1.12rem;">tempo, tranquilidade e clareza financeira</strong> para o dono da academia, garantindo que o balcão funcione com padrão profissional mesmo quando ele não está presente.
          </p>
        </div>

        <div class="kpi-strip">
          <div class="kpi-card panel">
            <div class="kpi-card-head">
              <span class="kpi-card-title">Tempo Livre</span>
              <span class="badge badge-ok">Autoatendimento</span>
            </div>
            <div class="kpi-card-value" style="font-size:1.35rem;">Menos balcão</div>

              <span class="kpi-card-title">Delegação Segura</span>
              <span class="badge badge-ok">RBAC + Auditoria</span>

            <div class="kpi-card-sub">Cada perfil vê só o necessário e toda ação sensível fica registrada.</div>
          </div>

          <div class="kpi-card panel">
            <div class="kpi-card-head">
              <span class="kpi-card-title">Receita Protegida</span>
              <span class="badge badge-ok">Check-in Visual</span>
            </div>
            <div class="kpi-card-value" style="font-size:1.35rem;">Zero "carona"</div>

          </div>

          <div class="kpi-card panel">
            <div class="kpi-card-head">
              <span class="kpi-card-title">Risco Jurídico</span>
              <span class="badge badge-ok">LGPD Nativa</span>

            <div class="kpi-card-sub">Consentimento versionado, bucket privado de fotos e exportação em cliques.</div>
          </div>
        </div>

      <section id="qualidade-vida" class="doc-section">
        <div class="doc-section-head">
          <div>
            <div class="eyebrow">Pilar 01 · Rotina &amp; Bem-estar</div>
            <h2 class="doc-section-title">Melhorias de Qualidade de Vida para o Dono</h2>
          </div>
          <span class="badge badge-idle">4 ganhos diretos no dia a dia</span>
        </div>

        <div class="grid-cards-2">
          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">

                <span class="badge badge-ok">Rotina leve</span>
              </div>

                Consultas de vencimento, atualização de telefone e envio de foto deixam de depender do dono ou da recepcionista parando o atendimento. O <strong>Portal do Aluno</strong> entrega autoatendimento direto, e qualquer busca por nome ou CPF na recepção responde em menos de 1 segundo.
              </p>
            </div>
            <div class="doc-card-foot">
              <span>Impacto: menos interrupções fora do horário</span>
              <a href="minha-conta.html" class="no-print">Ver Portal do Aluno →</a>
            </div>
          </article>

          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">
                <div>
                  <span class="doc-card-num">Ganho 02</span>
                  <h3 class="doc-card-title">Tranquilidade para viajar ou focar na estratégia</h3>

                <span class="badge badge-ok">Delegação</span>
              </div>
              <p class="doc-card-body" style="margin-top:0.55rem;">
                Com <strong>perfis de acesso separados</strong> (Administrador, Recepção, Professor), a equipe opera sem ver dados confidenciais de funcionários ou financeiro global. E se algo mudar em um cadastro ou pagamento, a <strong>Auditoria imutável</strong> registra quem fez, quando e de qual IP.
              </p>
            </div>
            <div class="doc-card-foot">
              <span>Impacto: confiança para delegar sem perder visão</span>
              <a href="audit.html" class="no-print">Ver Auditoria →</a>
            </div>
          </article>

          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">
                <div>
                  <span class="doc-card-num">Ganho 03</span>
                  <h3 class="doc-card-title">Matrículas e fotos 3×4 sem papelada nem retrabalho</h3>
                </div>
                <span class="badge badge-ok">Agilidade</span>
              </div>
              <p class="doc-card-body" style="margin-top:0.55rem;">
                O interessado preenche a <strong>pré-matrícula online</strong> pelo celular e já chega pronto para conferência. Na recepção, a foto 3×4 é capturada pela webcam ou tablet com recorte padronizado — eliminando fotos em celulares pessoais e digitação dupla de fichas.
              </p>
            </div>
            <div class="doc-card-foot">
              <span>Impacto: cadastro completo em segundos</span>
              <a href="matricula.html" class="no-print">Ver Pré-matrícula →</a>
            </div>
          </article>

          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">
                <div>
                  <span class="doc-card-num">Ganho 04</span>
                  <h3 class="doc-card-title">Menos estresse com fiscalização e privacidade (LGPD)</h3>
                </div>
                <span class="badge badge-ok">Paz jurídica</span>
              </div>
              <p class="doc-card-body" style="margin-top:0.55rem;">
                Fotos ficam em armazenamento privado com URL temporária, dados de saúde são protegidos e o aceite do termo de uso de imagem fica versionado por data. Se um ex-aluno solicitar portabilidade ou anonimização, o dono resolve em poucos cliques.
              </p>
            </div>
            <div class="doc-card-foot">
              <span>Impacto: proteção contra passivos e vazamentos</span>
              <a href="privacy.html" class="no-print">Ver Privacidade &amp; LGPD →</a>
            </div>
          </article>
        </div>
      </section>

      <!-- 3. VISÃO DE NEGÓCIO -->
      <section id="visao-negocio" class="doc-section">
        <div class="doc-section-head">
          <div>
            <div class="eyebrow">Pilar 02 · Receita, Retenção &amp; Marca</div>
            <h2 class="doc-section-title">Visão de Negócio &amp; Crescimento Sustentável</h2>
          </div>
          <span class="badge badge-idle">4 alavancas de resultado</span>
        </div>

        <div class="grid-cards-2">
          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">
                <div>
                  <span class="doc-card-num">Alavanca 01</span>
                  <h3 class="doc-card-title">Captação ativa e funil de interessados organizado</h3>
                </div>
                <span class="badge badge-warn">Conversão</span>
              </div>
              <p class="doc-card-body" style="margin-top:0.55rem;">

            </div>
            <div class="doc-card-foot">

          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">
                <div>
                  <span class="doc-card-num">Alavanca 02</span>

                <span class="badge badge-ok">Caixa saudável</span>

                <span class="badge badge-ok">Previsibilidade</span>
              </div>
              <p class="doc-card-body" style="margin-top:0.55rem;">
                O <strong>Painel da Academia</strong> mostra faturamento recebido vs. previsto, distribuição por plano, frequência dos últimos 7 dias e horários de pico (manhã vs. tarde/noite) — base concreta para escalar professores e criar promoções em horários ociosos.
              </p>

            <div class="doc-card-foot">

          <article class="panel doc-card">
            <div>
              <div class="doc-card-head">
                <div>
                  <span class="doc-card-num">Alavanca 04</span>
                  <h3 class="doc-card-title">Posicionamento premium e base pronta para escalar</h3>
                </div>
                <span class="badge badge-idle">Expansão</span>
              </div>
              <p class="doc-card-body" style="margin-top:0.55rem;">

              </p>
            </div>
            <div class="doc-card-foot">
              <span>Resultado: ativo tecnológico valoriza o negócio</span>
              <a href="index.html" class="no-print">Ver Site Público →</a>
            </div>

      <!-- 4. ANTES VS DEPOIS -->
      <section id="antes-depois" class="doc-section">

              </tr>
            </thead>

              <tr>
                <td><strong>Painel da Academia</strong></td>
                <td>Visão do dia em 10 segundos sem pedir relatório para ninguém.</td>
                <td>Identifica queda de frequência e meta mensal antes do mês fechar.</td>
                <td class="no-print"><a href="dashboard.html" class="btn btn-secondary btn-sm">Abrir</a></td>
              </tr>
