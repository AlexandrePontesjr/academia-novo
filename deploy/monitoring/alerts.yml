# As seis regras de alerta da door 6 (AC 29). Cada uma tem um limiar e, onde o PRD pede, um `for`.
groups:
  - name: operacao
    rules:
      - alert: CaddyDown
        expr: up{job="caddy"} == 0
        for: 2m

      - alert: WebDown
        expr: probe_success{job="blackbox-web"} == 0
        for: 2m

      - alert: ApiHealthDegraded
        expr: probe_success{job="blackbox-api"} == 0
        for: 2m

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 15m

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 93600

      - alert: Http5xxHigh
        expr: >-
          (sum(rate(caddy_http_response_duration_seconds_count{code=~"5.."}[10m])) or vector(0))
          / sum(rate(caddy_http_response_duration_seconds_count[10m])) > 0.05
