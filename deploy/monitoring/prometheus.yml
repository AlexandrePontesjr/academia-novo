# O Prometheus da homologação (door 6): raspa o caddy em :9180, o node-exporter, e as duas sondas
# do blackbox-exporter sobre o `web` e o `/health` da `api`. As regras ficam em `alerts.yml`.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: caddy
    static_configs:
      - targets: ['caddy:9180']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: blackbox-web
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3000/login']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-api
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api:3001/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
