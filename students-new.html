<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Novo Aluno</title>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('students.html', `
      <div class="screen-header">
        <div>
          <div class="eyebrow">Alunos</div>
          <h1 class="screen-title">Novo aluno</h1>
          <p class="screen-meta">Cadastre os dados pessoais para liberar matrícula e acesso.</p>
        </div>
        <a href="students.html" class="btn btn-secondary">← Voltar</a>
      </div>

      <section class="panel" style="max-width:44rem;">
        <form onsubmit="event.preventDefault(); window.demoToast('Aluno cadastrado com sucesso!'); setTimeout(()=>location.href='student-detail.html', 800);" style="display:grid;gap:1rem;">
          <div class="field">
            <label class="label" for="s-nome">Nome completo</label>
            <input class="input" id="s-nome" placeholder="Ex: Gabriel Martins Ribeiro" required />
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="s-cpf">CPF</label>
              <input class="input" id="s-cpf" placeholder="000.000.000-00" required />
            </div>
            <div class="field">
              <label class="label" for="s-nasc">Data de nascimento</label>
              <input class="input" id="s-nasc" type="date" value="1995-04-18" required />
            </div>
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="s-tel">Telefone / WhatsApp</label>
              <input class="input" id="s-tel" placeholder="(92) 99999-0000" required />
            </div>
            <div class="field">
              <label class="label" for="s-email">E-mail</label>
              <input class="input" id="s-email" type="email" placeholder="aluno@email.com" required />
            </div>
          </div>
          <div class="field">
            <label class="label" for="s-end">Endereço</label>
            <input class="input" id="s-end" placeholder="Rua, número, bairro — Manaus/AM" />
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;padding-top:0.5rem;">
            <a href="students.html" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar aluno</button>
          </div>
        </form>
      </section>
    `);
  </script>
</body>
</html>
