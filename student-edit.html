<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Editar Aluno</title>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('students.html', `
      <div class="screen-header">
        <div>
          <div class="eyebrow">Alunos</div>
          <h1 class="screen-title">Editar: Lucas Andrade</h1>
          <p class="screen-meta">Atualize os dados cadastrais do aluno.</p>
        </div>
        <a href="student-detail.html" class="btn btn-secondary">← Voltar à ficha</a>
      </div>

      <section class="panel" style="max-width:44rem;">
        <form onsubmit="event.preventDefault(); window.demoToast('Alterações salvas!'); setTimeout(()=>location.href='student-detail.html', 800);" style="display:grid;gap:1rem;">
          <div class="field">
            <label class="label" for="e-nome">Nome completo</label>
            <input class="input" id="e-nome" value="Lucas Andrade" required />
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="e-cpf">CPF</label>
              <input class="input" id="e-cpf" value="321.654.987-00" required />
            </div>
            <div class="field">
              <label class="label" for="e-nasc">Data de nascimento</label>
              <input class="input" id="e-nasc" type="date" value="1994-06-14" required />
            </div>
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="e-tel">Telefone / WhatsApp</label>
              <input class="input" id="e-tel" value="(92) 99123-4567" required />
            </div>
            <div class="field">
              <label class="label" for="e-email">E-mail</label>
              <input class="input" id="e-email" type="email" value="lucas.andrade@email.com" required />
            </div>
          </div>
          <div class="field">
            <label class="label" for="e-end">Endereço</label>
            <input class="input" id="e-end" value="Av. Timbiras, 412 · Cidade Nova, Manaus–AM" />
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;padding-top:0.5rem;">
            <a href="student-detail.html" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
          </div>
        </form>
      </section>
    `);
  </script>
</body>
</html>
