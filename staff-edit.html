<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DukFit — Editar Funcionário</title>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body>
  <div id="app-root"></div>
  <script src="assets/demo.js"></script>
  <script>
    renderAppShell('staff.html', `
      <div class="screen-header">
        <div>
          <div class="eyebrow">Equipe</div>
          <h1 class="screen-title">Editar: Rafael Costa</h1>
          <p class="screen-meta">Atualize função, CREF ou contato do colaborador.</p>
        </div>
        <a href="staff-detail.html" class="btn btn-secondary">← Voltar à ficha</a>
      </div>

      <section class="panel" style="max-width:42rem;">
        <form onsubmit="event.preventDefault(); window.demoToast('Dados do funcionário salvos!'); setTimeout(()=>location.href='staff-detail.html', 800);" style="display:grid;gap:1rem;">
          <div class="field">
            <label class="label" for="ste-nome">Nome completo</label>
            <input class="input" id="ste-nome" value="Rafael Costa" required />
          </div>
          <div class="grid-cards-2">
            <div class="field">
              <label class="label" for="ste-cargo">Função</label>
              <input class="input" id="ste-cargo" value="Educador Físico" required />
            </div>
            <div class="field">
              <label class="label" for="ste-cref">CREF</label>
              <input class="input" id="ste-cref" value="004821-G/AM" />
            </div>
          </div>
          <div class="field">
            <label class="label" for="ste-tel">Telefone</label>
            <input class="input" id="ste-tel" value="(92) 99100-4455" required />
          </div>
          <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
            <a href="staff-detail.html" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
          </div>
        </form>
      </section>
    `);
  </script>
</body>
</html>
